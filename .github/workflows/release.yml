name: Release

# This fork is installed from source, not npm: a release is a tag plus notes.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g., v0.1.0)"
        required: true
        type: string
      release_notes:
        description: "Release notes content (markdown supported)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false
      draft:
        description: "Create as draft release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Tag and create GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push release tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Creating new tag: $RELEASE_TAG"
            git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
            git push origin "$RELEASE_TAG"
          else
            echo "Tag $RELEASE_TAG already exists"
          fi

      - name: Save release notes
        env:
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
        run: printf '%s\n' "$RELEASE_NOTES" > /tmp/release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes-file /tmp/release_notes.md \
            ${{ github.event.inputs.draft == 'true' && '--draft' || '' }} \
            ${{ github.event.inputs.prerelease == 'true' && '--prerelease' || '' }}
